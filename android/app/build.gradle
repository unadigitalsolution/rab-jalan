plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.una.alfastec'
    compileSdk 34

    defaultConfig {
        applicationId "com.una.alfastec"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // Signing untuk build RELEASE (bukan debug) diisi lewat environment variable,
    // supaya keystore & password tidak pernah masuk ke repo. GitHub Actions
    // akan mengisi variabel ini dari Secrets pada Tahap 4.
    signingConfigs {
        release {
            def ksPath = System.getenv("ALFASTEC_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("ALFASTEC_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ALFASTEC_KEY_ALIAS")
                keyPassword System.getenv("ALFASTEC_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("ALFASTEC_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
