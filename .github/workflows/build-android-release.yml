name: Build ALFASTEC Android (Release APK)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'android-v*'

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform & build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Pastikan secret keystore release tersedia
        working-directory: android
        run: |
          if [ -z "${{ secrets.ALFASTEC_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret ALFASTEC_KEYSTORE_BASE64 belum diisi."
            exit 1
          fi
          if [ -z "${{ secrets.ALFASTEC_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.ALFASTEC_KEY_ALIAS }}" ] || [ -z "${{ secrets.ALFASTEC_KEY_PASSWORD }}" ]; then
            echo "::error::Secret signing release belum lengkap."
            exit 1
          fi

      - name: Decode keystore dari secret
        working-directory: android
        run: |
          echo "${{ secrets.ALFASTEC_KEYSTORE_BASE64 }}" | base64 -d > app/alfastec-release.keystore

      - name: Build APK RELEASE (signed)
        working-directory: android
        env:
          ALFASTEC_KEYSTORE_PATH: alfastec-release.keystore
          ALFASTEC_KEYSTORE_PASSWORD: ${{ secrets.ALFASTEC_KEYSTORE_PASSWORD }}
          ALFASTEC_KEY_ALIAS: ${{ secrets.ALFASTEC_KEY_ALIAS }}
          ALFASTEC_KEY_PASSWORD: ${{ secrets.ALFASTEC_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Pastikan hasil build RELEASE dan signed
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::Tidak ditemukan APK release."
            exit 1
          fi
          case "$APK" in
            *unsigned*) echo "::error::APK unsigned."; exit 1 ;;
          esac
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Verifikasi tanda tangan APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALFASTEC-android-release
          path: ${{ env.APK_PATH }}
          retention-days: 90

      - name: Hapus file keystore dari runner
        if: always()
        run: rm -f android/app/alfastec-release.keystore
