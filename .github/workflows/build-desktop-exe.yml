name: Build ALFASTEC Desktop (Windows Installer)
# Final build trigger: 2026-09-22

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags:
      - 'desktop-v*'

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 untuk Electron
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Jalankan test bawaan
        run: |
          npm test
          npm run security-check

      - name: Build installer (.exe)
        env:
          CSC_LINK: ${{ secrets.ALFASTEC_WIN_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.ALFASTEC_WIN_CERT_PASSWORD }}
        run: npm run build

      - name: Audit isi paket Electron
        run: node tools/verify-packaged-app.js

      - name: Smoke test aplikasi hasil packaging
        shell: pwsh
        run: |
          $app = Join-Path $PWD "dist\win-unpacked\ALFASTEC.exe"
          if (-not (Test-Path $app)) {
            Write-Error "Executable hasil unpacked tidak ditemukan: $app"
            exit 1
          }
          $p = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Error "ALFASTEC berhenti sendiri saat startup packaging test. ExitCode=$($p.ExitCode)"
            exit 1
          }
          Write-Host "ALFASTEC tetap berjalan setelah 10 detik startup test."
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Pastikan installer benar-benar dihasilkan
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Tidak ditemukan file .exe di folder dist/ setelah build."
            exit 1
          }
          Write-Host "Installer ditemukan: $($exe.FullName)"
          "EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Uji instalasi NSIS dan startup aplikasi terpasang
        shell: pwsh
        run: |
          $exe = $env:EXE_PATH
          $installDir = Join-Path $PWD "installed-test"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $installer = Start-Process -FilePath $exe -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            Write-Error "Installer NSIS gagal. ExitCode=$($installer.ExitCode)"
            exit 1
          }
          $installedApp = Join-Path $installDir "ALFASTEC.exe"
          if (-not (Test-Path $installedApp)) {
            Write-Error "ALFASTEC.exe tidak ditemukan setelah instalasi: $installedApp"
            exit 1
          }
          $installedRenderer = Join-Path $installDir "resources\\renderer\\index.html"
          if (-not (Test-Path $installedRenderer)) {
            Write-Error "Renderer tidak ikut terpasang: $installedRenderer"
            exit 1
          }
          $p = Start-Process -FilePath $installedApp -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Error "ALFASTEC berhenti setelah instalasi. ExitCode=$($p.ExitCode)"
            exit 1
          }
          Write-Host "INSTALLATION STARTUP TEST: PASS"
          Write-Host "Installed app: $installedApp"
          Write-Host "Installed renderer: $installedRenderer"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Unggah installer sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALFASTEC-windows-installer
          path: ${{ env.EXE_PATH }}
          if-no-files-found: error
          retention-days: 90
